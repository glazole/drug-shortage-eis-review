[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "drug-shortage-eis-review"
version = "0.1.0"
description = "Reproducible modular evidence-search pipeline for drug-shortage and enterprise information systems research."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0,<7.0",
]

[project.scripts]
evidence-search = "evidence_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
