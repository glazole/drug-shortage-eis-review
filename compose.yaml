services:
  evidence-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: drug-shortage-eis-review:local
    restart: unless-stopped
    init: true
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      EVIDENCE_STUDIES_ROOT: /app/studies
      EVIDENCE_DATABASE_PATH: /app/data/review.sqlite3
      EVIDENCE_DEFAULT_STUDY_ID: ${EVIDENCE_DEFAULT_STUDY_ID:-drug_shortage_eis}
      EVIDENCE_DEFAULT_PROFILE_ID: ${EVIDENCE_DEFAULT_PROFILE_ID:-baseline}
      EVIDENCE_MIN_YEAR: ${EVIDENCE_MIN_YEAR:-}
      EVIDENCE_MAX_YEAR: ${EVIDENCE_MAX_YEAR:-}
      EVIDENCE_SEARCH_LANGUAGE: ${EVIDENCE_SEARCH_LANGUAGE:-}
      EVIDENCE_INCLUDE_ABSTRACTS: ${EVIDENCE_INCLUDE_ABSTRACTS:-}
      EVIDENCE_SOURCE_PUBMED_ENABLED: ${EVIDENCE_SOURCE_PUBMED_ENABLED:-}
      EVIDENCE_SOURCE_PUBMED_REQUIRED: ${EVIDENCE_SOURCE_PUBMED_REQUIRED:-}
      EVIDENCE_SOURCE_OPENALEX_ENABLED: ${EVIDENCE_SOURCE_OPENALEX_ENABLED:-}
      EVIDENCE_SOURCE_OPENALEX_REQUIRED: ${EVIDENCE_SOURCE_OPENALEX_REQUIRED:-}
      EVIDENCE_SOURCE_CROSSREF_ENABLED: ${EVIDENCE_SOURCE_CROSSREF_ENABLED:-}
      EVIDENCE_SOURCE_CROSSREF_REQUIRED: ${EVIDENCE_SOURCE_CROSSREF_REQUIRED:-}
      EVIDENCE_SOURCE_SCOPUS_ENABLED: ${EVIDENCE_SOURCE_SCOPUS_ENABLED:-}
      EVIDENCE_SOURCE_SCOPUS_REQUIRED: ${EVIDENCE_SOURCE_SCOPUS_REQUIRED:-}
      EVIDENCE_SOURCE_SCIENCEDIRECT_ENABLED: ${EVIDENCE_SOURCE_SCIENCEDIRECT_ENABLED:-}
      EVIDENCE_SOURCE_SCIENCEDIRECT_REQUIRED: ${EVIDENCE_SOURCE_SCIENCEDIRECT_REQUIRED:-}
      EVIDENCE_SOURCE_SEMANTIC_SCHOLAR_ENABLED: ${EVIDENCE_SOURCE_SEMANTIC_SCHOLAR_ENABLED:-}
      EVIDENCE_SOURCE_SEMANTIC_SCHOLAR_REQUIRED: ${EVIDENCE_SOURCE_SEMANTIC_SCHOLAR_REQUIRED:-}
      RESEARCH_CONTACT_EMAIL: ${RESEARCH_CONTACT_EMAIL:-researcher@example.org}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      NCBI_API_KEY: ${NCBI_API_KEY:-}
      SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
      ELSEVIER_API_KEY: ${ELSEVIER_API_KEY:-}
      ELSEVIER_INSTTOKEN: ${ELSEVIER_INSTTOKEN:-}
      SCOPUS_SEARCH_VIEW: ${SCOPUS_SEARCH_VIEW:-STANDARD}
    volumes:
      - evidence-data:/app/data
      - ./studies:/app/studies:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  evidence-data:
